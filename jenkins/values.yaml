
# jenins controller values

controller:
  serviceType: ClusterIP

  nodeSelector:
    workload: jenkins

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  javaOpts: >-
    -Xms265m
    -Xmx1024m

  additionalPlugins:
    - junit

  probes:
    startupProbe:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 60

    livenessProbe:
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6

persistence:
  enabled: true
  storageClass: standard
  accessMode: ReadWriteOnce
  size: 8Gi

serviceAccount:
  create: true

rbac:
  create: true